[project]
name = "matchiq-agents"
version = "0.1.0"
description = "MatchIQ multi-agent narrative service (Microsoft Agent Framework + Foundry)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-framework-core==1.22.0",
  "agent-framework-foundry==1.15.0",
  "agent-framework-openai==1.17.0",
  "azure-identity==1.26.0",
  "fastapi==0.156.8",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.86.0",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchiq_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/matchiq_agents/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "TID", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]
"scripts/**" = ["T201"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["src/matchiq_agents/contracts/generated"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not ollama'"
markers = ["ollama: live local-Ollama tests; opt in with OLLAMA_LIVE=1 pytest -m ollama"]

[tool.datamodel-codegen]
input = "../../libs/contracts/generated/json-schema"
input-file-type = "jsonschema"
output = "src/matchiq_agents/contracts/generated"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-annotated = true
use-standard-collections = true
use-union-operator = true
use-title-as-name = true
field-constraints = true
extra-fields = "forbid"
disable-timestamp = true
formatters = ["ruff-format"]
