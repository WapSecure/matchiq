# MatchIQ login theme (MQ-054). Extends Keycloak 26's keycloak.v2 login theme:
# its templates and scripts are reused; PatternFly is replaced by css/matchiq.css,
# which carries the web app's tokens (apps/web/src/app/global.css).
parent=keycloak.v2
import=common/keycloak

# An empty value drops the parent's PatternFly stylesheets; every asset is self-hosted.
stylesCommon=
styles=css/matchiq.css

# Fallback for "Back to MatchIQ" when a page has no client (for example an
# expired link). Pages with a client use the client's base URL.
matchiqAppUrl=${env.WEB_PUBLIC_URL:http://localhost:4200}

kcInputErrorIconClass=mq-icon mq-icon-alert
kcFormPasswordVisibilityIconShow=mq-icon mq-icon-eye
kcFormPasswordVisibilityIconHide=mq-icon mq-icon-eye-off
kcFeedbackErrorIcon=mq-icon mq-icon-alert
kcFeedbackWarningIcon=mq-icon mq-icon-alert
kcFeedbackSuccessIcon=mq-icon mq-icon-check
kcFeedbackInfoIcon=mq-icon mq-icon-info
kcAlertClass=mq-alert
kcButtonBlockClass=mq-block
