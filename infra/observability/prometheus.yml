# Scrapes the internal /metrics listeners. Each job lists both ways of running the
# services: natively on the host (host.docker.internal) and in the compose `app`
# profile (service DNS). The target that is not running shows as down; alerts use
# `max by (job) (up)` so one live target is enough.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: matchiq-api
    static_configs:
      - targets: ['host.docker.internal:9464', 'api:9464']
  - job_name: matchiq-worker
    static_configs:
      - targets: ['host.docker.internal:9465', 'worker:9465']
