# Overlay for a single public host. Usage (from the repository root):
#   MATCHIQ_DOMAIN=demo.example.com docker compose -f docker-compose.yml -f infra/vps/compose.vps.yml --profile app up -d --build
# Only Caddy binds public ports; every other service stays on 127.0.0.1 or the compose network.
services:
  caddy:
    profiles: [app]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      MATCHIQ_DOMAIN: ${MATCHIQ_DOMAIN:?set MATCHIQ_DOMAIN to the public hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  api:
    restart: unless-stopped
    environment:
      APP_ENV: stage
      API_PUBLIC_URL: https://${MATCHIQ_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${MATCHIQ_DOMAIN}
      # Caddy is the one hop in front of the API; req.ip (rate limits) is the client it saw.
      TRUST_PROXY: '1'
      STREAM_TICKET_SECRET: ${STREAM_TICKET_SECRET:?set STREAM_TICKET_SECRET (openssl rand -hex 32)}
      # ADR-0015: the public demo tenant. Add OIDC_ISSUER_URL and OIDC_AUDIENCE to enable sign-in.
      AUTH_ANONYMOUS_DEMO_ENABLED: 'true'

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: stage
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:?set AGENTS_SERVICE_TOKEN (openssl rand -hex 32)}

  agents:
    restart: unless-stopped
    environment:
      APP_ENV: stage
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:?set AGENTS_SERVICE_TOKEN (openssl rand -hex 32)}

  web:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${MATCHIQ_DOMAIN}/api/v1

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  redis:
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
