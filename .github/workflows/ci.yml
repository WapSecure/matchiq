name: CI

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev, stage, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny by default; each job asks for what it needs.
permissions: {}

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  UV_FROZEN: '1'

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].{4,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(contracts): add overlay cue schema'"
            exit 1
          fi

  promotion:
    name: Promotion path
    if: github.event_name == 'pull_request' && (github.base_ref == 'stage' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce dev -> stage -> main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "stage" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Only dev may be promoted to stage"; exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "stage" ]; then
            echo "::error::Only stage may be promoted to main"; exit 1
          fi

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # Integration tests (libs/db, apps/api) need real Postgres and Redis. Ports and
    # credentials match docker-compose.yml and .env.example; tests create and drop
    # their own databases on this server.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: matchiq
          POSTGRES_PASSWORD: matchiq_local_only
          POSTGRES_DB: matchiq
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U matchiq -d matchiq"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://matchiq:matchiq_local_only@localhost:54320/matchiq
      TEST_REDIS_URL: redis://localhost:63790
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: hashFiles('apps/agents/uv.lock') != ''
        with:
          enable-cache: true
          cache-dependency-glob: apps/agents/uv.lock
      - run: pnpm install --frozen-lockfile
      - if: hashFiles('apps/agents/uv.lock') != ''
        run: uv sync
        working-directory: apps/agents
      - name: Workspace configuration in sync
        run: pnpm nx sync:check
      - name: Formatting
        run: pnpm format:check
      - name: Lint, typecheck, test, build
        run: pnpm nx run-many -t lint typecheck test build --parallel=3
      - name: Generated contracts are up to date
        run: |
          pnpm nx run-many -t export-json-schema codegen --skip-nx-cache
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx run-many -t e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web-e2e/test-output
          retention-days: 7

  container:
    name: Container image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            args: -f apps/api/Dockerfile .
          - app: worker
            args: -f apps/worker/Dockerfile .
          - app: web
            args: -f apps/web/Dockerfile .
          - app: agents
            args: apps/agents
    env:
      IMAGE: matchiq-${{ matrix.app }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086
          DOCKER_BUILDKIT=1 docker build -t "$IMAGE" $ARGS
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Install Trivy
        run: .github/scripts/install-trivy.sh
      - name: CycloneDX SBOM
        env:
          APP: ${{ matrix.app }}
        run: trivy image --quiet --format cyclonedx --output "sbom-$APP.cdx.json" "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json
          retention-days: 30
      - name: Vulnerability scan (fail on fixable high or critical)
        run: >-
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1 "$IMAGE"

  iac:
    name: IaC and filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: .github/scripts/install-trivy.sh
      - name: Compile Bicep to ARM for scanning
        env:
          POSTGRES_ADMIN_PASSWORD: x
          OPERATOR_API_KEY: x
          AGENTS_SERVICE_TOKEN: x
          FOUNDRY_MODEL_NAME: x
          FOUNDRY_MODEL_VERSION: x
        run: |
          az bicep install --version v0.48.1
          mkdir -p "$RUNNER_TEMP/arm"
          # Modules compile separately: Trivy does not inspect templates nested in deployments.
          for file in infra/azure/main.bicep infra/azure/modules/*.bicep; do
            az bicep build --file "$file" --outdir "$RUNNER_TEMP/arm"
          done
      - name: Misconfiguration scan (infra, compose, Dockerfiles)
        run: >-
          trivy config --quiet --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml --exit-code 1
          --skip-dirs node_modules --skip-dirs apps/agents/.venv .
      - name: Misconfiguration scan (Bicep compiled to ARM)
        # Report every scanner's findings even when an earlier one fails.
        if: success() || failure()
        run: >-
          trivy config --quiet --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml --exit-code 1 "$RUNNER_TEMP/arm"
      - name: ARM templates were recognised
        run: |
          trivy config --quiet --format json --output "$RUNNER_TEMP/arm.json" "$RUNNER_TEMP/arm"
          jq -e '[.Results[]? | select(.Type == "azure-arm")] | length > 0' "$RUNNER_TEMP/arm.json" \
            || { echo "::error::Trivy scanned no ARM templates"; exit 1; }
      - name: Lockfile vulnerability scan (fail on fixable high or critical)
        # Report every scanner's findings even when an earlier one fails.
        if: success() || failure()
        run: >-
          trivy fs --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1
          --skip-dirs node_modules --skip-dirs apps/agents/.venv .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/generated/**'
              - '**/node_modules/**'
              - '**/.next/**'
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql
      - name: Fail on high or critical results
        run: .github/scripts/codeql-gate.sh "$RUNNER_TEMP/codeql"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  infra:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and lint
        env:
          POSTGRES_ADMIN_PASSWORD: x
          STREAM_TICKET_SECRET: x
          AGENTS_SERVICE_TOKEN: x
          FOUNDRY_MODEL_NAME: x
          FOUNDRY_MODEL_VERSION: x
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep lint --file infra/azure/main.bicep
          for env in dev stage prod; do
            az bicep build-params --file "infra/azure/env/$env.bicepparam" --stdout > /dev/null
          done

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Scan only history reachable from the commit under test; fetch-depth 0 also fetches unrelated branches.
          ./gitleaks git --redact --no-banner --exit-code 1 --config .gitleaks.toml --log-opts=HEAD .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm dependency audit
        run: pnpm audit --prod --audit-level=high
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: hashFiles('apps/agents/uv.lock') != ''
      - name: Python dependency audit
        if: hashFiles('apps/agents/uv.lock') != ''
        working-directory: apps/agents
        run: uv export --no-dev --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt" && uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --strict --disable-pip --no-deps
