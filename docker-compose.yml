name: matchiq

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchiq_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-matchiq}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-63790}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Local OpenID Connect provider (ADR-0018); `pnpm infra:up` starts it ---
  # Dev-only: in-memory H2 store, bootstrap admin admin/admin, seeded users with
  # the password in docs/security/IDENTITY_AND_ACCESS.md. Never expose it.
  keycloak:
    profiles: [infra]
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixes the token issuer so host and container callers agree on it.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8180}:8080'
    volumes:
      - ./infra/keycloak/matchiq-realm.json:/opt/keycloak/data/import/matchiq-realm.json:ro
    healthcheck:
      # The image ships no curl; probe the management port over bash's /dev/tcp.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- Opt-in application stack: docker compose --profile app up --build ---
  # Values come from .env via interpolation; defaults are local-only placeholders.
  # Explicit blocks (not env_file) keep compose-DNS URLs authoritative over the localhost URLs in .env.
  # One-shot schema migration and template seed from the api image (Nx prune ships libs/db
  # with its migrations; the image carries fixtures/). Seeding is idempotent, so a fresh
  # `--profile app up` is demo-ready and a re-run writes nothing.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: matchiq-api:local
    # Run from node_modules so libs/db resolves its own dependencies (synthetic-data).
    command:
      - sh
      - -c
      - node node_modules/@matchiq/db/dist/cli/migrate.js && node node_modules/@matchiq/db/dist/cli/seed-fixtures.js fixtures
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchiq}:${POSTGRES_PASSWORD:-matchiq_local_only}@postgres:5432/${POSTGRES_DB:-matchiq}
      DEMO_ORG_ID: ${DEMO_ORG_ID:-org_demo}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: matchiq-api:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_FAULTS_ENABLED: ${DEMO_FAULTS_ENABLED:-false}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_ORG_ID: ${DEMO_ORG_ID:-org_demo}
      API_PORT: '3000'
      API_PUBLIC_URL: http://localhost:${API_PORT:-3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchiq}:${POSTGRES_PASSWORD:-matchiq_local_only}@postgres:5432/${POSTGRES_DB:-matchiq}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-matchiq}
      OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-200}
      SSE_HEARTBEAT_MS: ${SSE_HEARTBEAT_MS:-15000}
      REPLAY_RATE_LIMIT_PER_MINUTE: ${REPLAY_RATE_LIMIT_PER_MINUTE:-30}
      REPLAY_MAX_ACTIVE_SESSIONS: ${REPLAY_MAX_ACTIVE_SESSIONS:-10}
      REPLAY_IDLE_TIMEOUT_MS: ${REPLAY_IDLE_TIMEOUT_MS:-600000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # ADR-0018. The issuer is the host-facing Keycloak URL (tokens carry it);
      # keys are fetched over the compose network. Sign-in needs `--profile infra`.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8180/realms/matchiq}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-matchiq-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/matchiq/protocol/openid-connect/certs}
      AUTH_ANONYMOUS_DEMO_ENABLED: ${AUTH_ANONYMOUS_DEMO_ENABLED:-true}
      AUTH_OPERATOR_KEY_ENABLED: ${AUTH_OPERATOR_KEY_ENABLED:-false}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      STREAM_TICKET_SECRET: ${STREAM_TICKET_SECRET:-local_only_stream_ticket_secret_change_me}
      OTEL_SERVICE_NAME: matchiq-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Internal only: reachable on the compose network by Prometheus, never published.
      METRICS_HOST: 0.0.0.0
    expose: ['9464']
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: matchiq-worker:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_FAULTS_ENABLED: ${DEMO_FAULTS_ENABLED:-false}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_ORG_ID: ${DEMO_ORG_ID:-org_demo}
      WORKER_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchiq}:${POSTGRES_PASSWORD:-matchiq_local_only}@postgres:5432/${POSTGRES_DB:-matchiq}
      REDIS_URL: redis://redis:6379
      # Must match the API: BullMQ queues and stream channels are namespaced by it.
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-matchiq}
      AGENTS_SERVICE_URL: http://agents:8000
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:-local_only_agents_service_token_change_me}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-8000}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-2}
      AGENT_CIRCUIT_FAILURE_THRESHOLD: ${AGENT_CIRCUIT_FAILURE_THRESHOLD:-5}
      AI_ENABLED: ${AI_ENABLED:-false}
      AGENT_JOB_CONCURRENCY: ${AGENT_JOB_CONCURRENCY:-2}
      REPLAY_MAX_ACTIVE_SESSIONS: ${REPLAY_MAX_ACTIVE_SESSIONS:-10}
      REPLAY_IDLE_TIMEOUT_MS: ${REPLAY_IDLE_TIMEOUT_MS:-600000}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-7}
      IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-24}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
      OTEL_SERVICE_NAME: matchiq-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      METRICS_HOST: 0.0.0.0
    expose: ['9465']
    ports:
      - '127.0.0.1:${WORKER_PORT:-3001}:3001'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      agents: { condition: service_healthy }

  # Runs the mock provider. Foundry needs Azure credentials, so run it natively (`pnpm nx serve agents`).
  agents:
    profiles: [app]
    build:
      context: apps/agents
    image: matchiq-agents:local
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_FAULTS_ENABLED: ${DEMO_FAULTS_ENABLED:-false}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      AGENTS_PORT: '8000'
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:-local_only_agents_service_token_change_me}
      MODEL_PROVIDER: mock
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - '127.0.0.1:${AGENTS_PORT:-8000}:8000'

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Resolved by the browser, so it must be the host-published API address.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
    image: matchiq-web:local
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:4200'
    depends_on:
      api: { condition: service_healthy }

  # --- Opt-in observability stack: docker compose --profile observability up -d ---
  # docs/operations/OBSERVABILITY.md. Local only: every port binds to 127.0.0.1.
  # Point the services at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # (native) or COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 (app profile).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./infra/observability/otel-collector.azure.yaml:/etc/otelcol/azure.yaml:ro
    environment:
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    ports:
      - '127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318'
    depends_on:
      tempo: { condition: service_started }

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # Reaches services running natively on the host (pnpm nx serve api|worker).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.10@sha256:c8f326efdb7be9be52047edaab34cf8dadb5152c1244af102eb0a517a7797068
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-red.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3300}:3000'
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }

  # --- Opt-in local model runtime (CPU): docker compose --profile ai up -d ollama ---
  # On macOS prefer native Ollama: Docker on macOS cannot use the Apple GPU.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.7@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  tempo-data:
  prometheus-data:
  grafana-data:
